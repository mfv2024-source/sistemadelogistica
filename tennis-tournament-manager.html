<!Doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Torneos de Tenis</title>
  <script>
  // ============================================================
  //  SDK conectado a api.php en Hostinger (MySQL)
  //  Cambia API_URL si tu archivo está en una subcarpeta
  // ============================================================
  (function() {
    const API_URL = 'api.php'; // Ruta relativa al archivo api.php

    async function apiCall(method, action, body) {
      try {
        const opts = {
          method,
          headers: { 'Content-Type': 'application/json' }
        };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(API_URL + '?action=' + action, opts);
        return await res.json();
      } catch(e) {
        console.error('API error:', e);
        return { ok: false, error: e.message };
      }
    }

    window.dataSdk = {
      init: async function(handler) {
        window._dataSdkHandler = handler;
        const res = await apiCall('GET', 'getAll');
        const data = res.data || [];
        if (handler && handler.onDataChanged) handler.onDataChanged(data);
        return { isOk: true };
      },
      create: async function(record) {
        const id = record.id || ('rec-' + Date.now() + '-' + Math.random().toString(36).slice(2));
        record.id = id; record.__backendId = id;
        const res = await apiCall('POST', 'create', record);
        if (res.ok !== false) {
          const all = await apiCall('GET', 'getAll');
          if (window._dataSdkHandler) window._dataSdkHandler.onDataChanged(all.data || []);
        }
        return { isOk: res.ok !== false };
      },
      update: async function(record) {
        const res = await apiCall('PUT', 'update', record);
        if (res.ok !== false) {
          const all = await apiCall('GET', 'getAll');
          if (window._dataSdkHandler) window._dataSdkHandler.onDataChanged(all.data || []);
        }
        return { isOk: res.ok !== false };
      },
      delete: async function(record) {
        const res = await apiCall('DELETE', 'delete', { id: record.id });
        if (res.ok !== false) {
          const all = await apiCall('GET', 'getAll');
          if (window._dataSdkHandler) window._dataSdkHandler.onDataChanged(all.data || []);
        }
        return { isOk: res.ok !== false };
      }
    };

    window.elementSdk = {
      config: {
        background_color: '#ffffff', surface_color: '#e5e7eb', text_color: '#000000',
        primary_action_color: '#3b82f6', secondary_action_color: '#64748b',
        font_family: 'Inter', font_size: 16,
        app_title: 'Sistema de Torneos de Tenis',
        tournament_1_name: 'Masters 2026', tournament_2_name: 'Torneo Apertura',
        tournament_3_name: 'Clausura', tournament_4_name: 'Asunción 1 Etapa',
        tournament_5_name: 'Toluca', tournament_6_name: 'Asunción 2 Etapa',
        tournament_7_name: 'Masters 2025', group_a_name: 'Grupo A', group_b_name: 'Grupo B'
      },
      init: function(opts) {
        if (opts && opts.defaultConfig) window.elementSdk.config = { ...opts.defaultConfig, ...window.elementSdk.config };
      },
      setConfig: function(partial) { window.elementSdk.config = { ...window.elementSdk.config, ...partial }; }
    };
  })();
  </script>

  <style>
    body {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    @keyframes slideInFromTop {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .validation-alert {
      animation: slideInFromTop 0.5s ease-out, pulse 2s ease-in-out infinite;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>

<base target="_blank">
</head>
<body class="min-h-full">
  <div id="app" class="min-h-full"></div>

  <!-- Admin Login Modal -->
  <div id="admin-login-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:#1e293b; border-radius:16px; padding:36px; max-width:380px; width:90%; box-shadow:0 25px 60px rgba(0,0,0,0.5); border:1px solid #334155;">
      <div style="text-align:center; margin-bottom:24px;">
        <div style="font-size:48px; margin-bottom:8px;">🔑</div>
        <h2 style="color:#f1f5f9; font-size:20px; font-weight:700; margin:0 0 6px;">Acceso de Administrador</h2>
        <p style="color:#94a3b8; font-size:14px; margin:0;">Ingresa la contraseña para editar</p>
      </div>
      <input id="admin-password-input" type="password" placeholder="Contraseña de administrador"
        style="width:100%; background:#0f172a; color:#f1f5f9; border:2px solid #475569; border-radius:8px; padding:12px 16px; font-size:15px; margin-bottom:8px; outline:none; box-sizing:border-box;"
        onkeydown="if(event.key==='Enter') attemptAdminLogin()">
      <div id="admin-login-error" style="display:none; color:#ef4444; font-size:13px; margin-bottom:10px; text-align:center;">❌ Contraseña incorrecta. Intenta de nuevo.</div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button onclick="hideAdminLoginModal()"
          style="flex:1; background:#334155; color:#f1f5f9; border:none; border-radius:8px; padding:12px; font-size:14px; font-weight:600; cursor:pointer;">
          Cancelar
        </button>
        <button onclick="attemptAdminLogin()"
          style="flex:1; background:#7c3aed; color:white; border:none; border-radius:8px; padding:12px; font-size:14px; font-weight:700; cursor:pointer;">
          Ingresar
        </button>
      </div>
    </div>
  </div>

  <script>
    const defaultConfig = {
      background_color: '#ffffff',
      surface_color: '#e5e7eb',
      text_color: '#000000',
      primary_action_color: '#3b82f6',
      secondary_action_color: '#64748b',
      font_family: 'Inter',
      font_size: 16,
      app_title: 'Sistema de Torneos de Tenis',
      tournament_1_name: 'Masters 2026',
      tournament_2_name: 'Torneo Apertura',
      tournament_3_name: 'Clausura',
      tournament_4_name: 'Asunción 1 Etapa',
      tournament_5_name: 'Toluca',
      tournament_6_name: 'Asunción 2 Etapa',
      tournament_7_name: 'Masters 2025',
      group_a_name: 'Grupo A',
      group_b_name: 'Grupo B'
    };

    let currentView = 'menu';
    let currentTournament = null;
    let selectedPlayerId = null;
    let playerSearchQuery = '';
    // Brackets — guardados en MySQL vía dataSdk (un registro por torneo)
    var bracketData = {};
    var allBracketRecords = []; // poblado desde dataHandler
    function buildBracketsFromAPI(data) {
      const records = data.filter(r => r.type === 'bracket_data');
      allBracketRecords = records;
      bracketData = {};
      records.forEach(r => {
        try { bracketData[r.tournament_id] = JSON.parse(r.data); } catch(e) {}
      });
    }
    async function saveBrackets(b, tid) {
      const payload = { type: 'bracket_data', tournament_id: tid, data: JSON.stringify(b[tid]) };
      const existing = allBracketRecords.find(r => r.tournament_id === tid);
      if (existing) {
        await window.dataSdk.update({ ...existing, ...payload });
      } else {
        await window.dataSdk.create({ id: 'bracket-' + tid, ...payload, created_at: new Date().toISOString() });
      }
    }
    // ── Admin Auth ──
    var isAdminLoggedIn = false;
    var pendingRankingChanges = {}; // cambios no guardados en modo admin
    const ADMIN_PASSWORD = 'admin2026'; // Cambia esta contraseña

    function showAdminLoginModal() {
      const modal = document.getElementById('admin-login-modal');
      if (modal) { modal.style.display = 'flex'; document.getElementById('admin-password-input').focus(); }
    }
    function hideAdminLoginModal() {
      const modal = document.getElementById('admin-login-modal');
      if (modal) { modal.style.display = 'none'; document.getElementById('admin-password-input').value = ''; document.getElementById('admin-login-error').style.display = 'none'; }
    }
    function attemptAdminLogin() {
      const input = document.getElementById('admin-password-input');
      if (input && input.value === ADMIN_PASSWORD) {
        isAdminLoggedIn = true;
        hideAdminLoginModal();
        render();
      } else {
        const err = document.getElementById('admin-login-error');
        if (err) err.style.display = 'block';
        if (input) input.value = '';
      }
    }
    async function adminLogout() {
      if (Object.keys(pendingRankingChanges).length > 0) {
        const save = confirm('Tienes cambios sin guardar en el ranking.\n\n¿Deseas guardar los cambios antes de salir?');
        if (save) {
          await saveAllRankingChanges();
        } else {
          // Revert pending changes from memory
          Object.keys(pendingRankingChanges).forEach(playerName => {
            const original = allRankingOverrides.find(r => r.player_name === playerName);
            if (original) {
              manualRankingOrder[playerName] = {
                pos: original.pos, utr: original.utr, pts: original.pts,
                pj: original.pj, pg: original.pg, pp: original.pp,
                sg: original.sg, sp: original.sp, ef: original.ef
              };
            } else {
              delete manualRankingOrder[playerName];
            }
          });
          pendingRankingChanges = {};
        }
      }
      isAdminLoggedIn = false;
      render();
    }

    async function saveAllRankingChanges() {
      console.log('[RANKING] saveAllRankingChanges INICIADO');
      // Limpiar entradas basura antes de guardar
      if (pendingRankingChanges['${safeName}']) {
        console.log('[RANKING] Eliminando entrada basura ${safeName}');
        delete pendingRankingChanges['${safeName}'];
      }
      const playerNames = Object.keys(pendingRankingChanges);
      console.log('[RANKING] Jugadores con cambios:', playerNames);
      if (playerNames.length === 0) {
        console.log('[RANKING] No hay cambios, saliendo');
        return;
      }
      const rankFields = ['pos', 'utr', 'pts', 'pj', 'pg', 'pp', 'sg', 'sp', 'ef'];
      let successCount = 0;
      let errorCount = 0;
      for (const playerName of playerNames) {
        // IGNORAR entradas basura
        if (playerName === '${safeName}') {
          console.log('[RANKING] IGNORANDO jugador basura:', playerName);
          continue;
        }
        const existing = allRankingOverrides.find(r => r.player_name === playerName);
        const pending = pendingRankingChanges[playerName] || {};
        const merged = {};
        // Solo guardar campos que el admin editó EXPLÍCITAMENTE en esta sesión (pending)
        // Esto evita que posiciones viejas "congelen" el orden cuando solo se editan puntos
        Object.keys(pending).forEach(f => {
          if (pending[f] !== undefined && pending[f] !== null && pending[f] !== '') merged[f] = pending[f];
        });
        console.log('[RANKING] Guardando', playerName, 'existing:', !!existing, 'merged:', merged);
        try {
          let result;
          if (existing) {
            result = await window.dataSdk.update({ ...existing, ...merged });
            console.log('[RANKING] Update resultado para', playerName, ':', result);
          } else {
            result = await window.dataSdk.create({
              id: 'rank-' + Date.now() + '-' + Math.random().toString(36).slice(2),
              type: 'ranking_override',
              player_name: playerName,
              ...merged,
              created_at: new Date().toISOString()
            });
            console.log('[RANKING] Create resultado para', playerName, ':', result);
          }
          if (result && result.isOk) {
            successCount++;
            console.log('[RANKING] ÉXITO guardando', playerName);
          } else {
            errorCount++;
            console.error('[RANKING] FALLO guardando', playerName, 'resultado:', result);
          }
        } catch (e) {
          console.error('[RANKING] ERROR guardando', playerName, e);
          errorCount++;
        }
      }
      console.log('[RANKING] Guardado completado. Éxitos:', successCount, 'Errores:', errorCount);
      pendingRankingChanges = {};
      if (errorCount === 0) {
        showMessage('Cambios del ranking guardados correctamente', 'success');
      } else {
        showMessage('Error al guardar ' + errorCount + ' cambios. Revisa la consola.', 'error');
      }
      render();
    }

    // ── Leyenda editable — guardada en MySQL ──
    var defaultLegendItems = [
      { key: 'utr', label: 'UTR', desc: 'Universal Tennis Rating (0-10)', color: '#f59e0b' },
      { key: 'pts', label: 'PTS', desc: 'Suma automática de todos los torneos (MySQL en vivo)', color: null },
      { key: 'pj',  label: 'PJ',  desc: 'Partidos Jugados', color: null },
      { key: 'pg',  label: 'PG',  desc: 'Partidos Ganados', color: null },
      { key: 'pp',  label: 'PP',  desc: 'Partidos Perdidos', color: null },
      { key: 'sg',  label: 'SG',  desc: 'Sets Ganados', color: null },
      { key: 'sp',  label: 'SP',  desc: 'Sets Perdidos', color: null },
      { key: 'ef',  label: 'EF%', desc: 'Eficiencia', color: null }
    ];
    var legendItems = defaultLegendItems.map(i => ({ ...i }));
    var pendingLegendChanges = {}; // key -> {label, desc}
    var editingLegend = false;
    var allLegendOverrides = [];

    function buildLegendFromAPI(data) {
      allLegendOverrides = data.filter(r => r.type === 'legend_override');
      legendItems = defaultLegendItems.map(def => {
        const ovr = allLegendOverrides.find(r => r.key === def.key);
        return ovr ? { ...def, label: ovr.label, desc: ovr.desc } : { ...def };
      });
    }

    function startEditLegend(e) { e && e.stopPropagation(); editingLegend = true; render(); }
    function cancelEditLegend() { editingLegend = false; pendingLegendChanges = {}; render(); }

    function updatePendingLegend(key, field, value) {
      if (!pendingLegendChanges[key]) pendingLegendChanges[key] = {};
      pendingLegendChanges[key][field] = value;
    }

    async function saveLegendChanges() {
      // Apply pending to legendItems in memory
      Object.keys(pendingLegendChanges).forEach(key => {
        const item = legendItems.find(i => i.key === key);
        if (item) {
          if (pendingLegendChanges[key].label !== undefined) item.label = pendingLegendChanges[key].label;
          if (pendingLegendChanges[key].desc  !== undefined) item.desc  = pendingLegendChanges[key].desc;
        }
      });
      // Persist each changed key to MySQL
      for (const key of Object.keys(pendingLegendChanges)) {
        const item = legendItems.find(i => i.key === key);
        if (!item) continue;
        const existing = allLegendOverrides.find(r => r.key === key);
        if (existing) {
          await window.dataSdk.update({ ...existing, label: item.label, desc: item.desc });
        } else {
          const newRec = {
            id: 'legend-' + key + '-' + Date.now(),
            type: 'legend_override',
            key: key,
            label: item.label,
            desc: item.desc,
            created_at: new Date().toISOString()
          };
          await window.dataSdk.create(newRec);
          allLegendOverrides.push(newRec);
        }
      }
      pendingLegendChanges = {};
      editingLegend = false;
      showMessage('Leyenda guardada correctamente', 'success');
      render();
    }

    async function resetLegend() {
      if (!confirm('¿Restablecer la leyenda a los valores originales?')) return;
      for (const rec of allLegendOverrides) { await window.dataSdk.delete(rec); }
      allLegendOverrides = [];
      legendItems = defaultLegendItems.map(i => ({ ...i }));
      pendingLegendChanges = {};
      editingLegend = false;
      showMessage('Leyenda restablecida', 'success');
      render();
    }

    // ── Ranking overrides — guardados en MySQL via dataSdk ──
    var manualRankingOrder = {}; // { playerName: { pos, utr, pts, pj, pg, pp, sg, sp, ef } }
    var allRankingOverrides = []; // populated from dataHandler

    function buildManualRankingFromAPI(data) {
      const overrides = data.filter(r => r.type === 'ranking_override');
      console.log('[RANKING] buildManualRankingFromAPI: overrides encontrados:', overrides.length);
      allRankingOverrides = overrides;
      manualRankingOrder = {};
      const rankFields = ['pos', 'utr', 'pts', 'pj', 'pg', 'pp', 'sg', 'sp', 'ef'];
      overrides.forEach(r => {
        if (r.player_name === '${safeName}') {
          console.log('[RANKING] IGNORANDO entrada basura:', r.id || r.__backendId);
          return;
        }
        const entry = {};
        rankFields.forEach(f => {
          if (r[f] !== undefined && r[f] !== null && r[f] !== '') entry[f] = r[f];
        });
        if (Object.keys(entry).length > 0) {
          manualRankingOrder[r.player_name] = entry;
          console.log('[RANKING] Cargado override para', r.player_name, ':', entry);
        }
      });
      console.log('[RANKING] manualRankingOrder completo:', JSON.parse(JSON.stringify(manualRankingOrder)));
      Object.keys(pendingRankingChanges).forEach(playerName => {
        if (playerName === '${safeName}') return;
        if (!manualRankingOrder[playerName]) manualRankingOrder[playerName] = {};
        Object.assign(manualRankingOrder[playerName], pendingRankingChanges[playerName]);
      });
    }

    function getRankingOverrideValue(ovr, field, autoValue) {
      if (!ovr || ovr[field] === undefined || ovr[field] === null || ovr[field] === '') return autoValue;
      return ovr[field];
    }

    var dragSrcIndex = null;

    // ── Fotos de torneos — archivo físico en uploads/, URL guardada en MySQL ──
    var allTournamentPhotos = []; // poblado desde dataHandler

    function getTournamentPhoto(tid) {
      const rec = allTournamentPhotos.find(p => p.tournament_id === tid);
      return rec ? rec.photo_url : '';
    }

    async function setTournamentPhotoUrl(tid, url) {
      const existing = allTournamentPhotos.find(p => p.tournament_id === tid);
      if (existing) {
        await window.dataSdk.update({ ...existing, photo_url: url });
      } else {
        await window.dataSdk.create({
          id: 'tphoto-' + tid + '-' + Date.now(),
          type: 'tournament_photo',
          tournament_id: tid,
          photo_url: url,
          created_at: new Date().toISOString()
        });
      }
    }

    async function removeTournamentPhoto(tid) {
      const existing = allTournamentPhotos.find(p => p.tournament_id === tid);
      if (!existing) return;
      // Borrar archivo del servidor
      try {
        await fetch('api.php?action=deletePhoto', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ photo_url: existing.photo_url })
        });
      } catch(e) {}
      await window.dataSdk.delete(existing);
    }

    async function handleTournamentPhotoUpload(tid, event) {
      const file = event.target.files[0];
      if (!file) return;

      showMessage('Subiendo foto...', 'success');

      // Redimensionar a máx 900px antes de enviar
      const MAX_PX = 900;
      const bitmap = await createImageBitmap(file).catch(() => null);

      let blob = file;
      if (bitmap) {
        let w = bitmap.width, h = bitmap.height;
        if (w > MAX_PX || h > MAX_PX) {
          if (w > h) { h = Math.round(h * MAX_PX / w); w = MAX_PX; }
          else       { w = Math.round(w * MAX_PX / h); h = MAX_PX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
        blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.82));
      }

      const formData = new FormData();
      formData.append('photo', blob, 'tournament_' + tid + '_' + Date.now() + '.jpg');
      formData.append('tournament_id', tid);

      try {
        const res = await fetch('api.php?action=uploadPhoto', { method: 'POST', body: formData });
        const json = await res.json();
        if (json.ok && json.url) {
          await setTournamentPhotoUrl(tid, json.url);
          showMessage('Foto guardada correctamente', 'success');
        } else {
          showMessage('Error al subir la foto: ' + (json.error || 'desconocido'), 'error');
        }
      } catch(e) {
        showMessage('Error de red al subir la foto', 'error');
      }
    }
    // Configuración de clasificación — guardada en MySQL vía dataSdk (registro único)
    var qualifySettings = {};
    var qualifySettingsRecord = null; // registro actual desde la API, o null si aún no existe
    function buildQualifySettingsFromAPI(data) {
      const rec = data.find(r => r.type === 'qualify_settings_data');
      qualifySettingsRecord = rec || null;
      qualifySettings = {};
      if (rec && rec.data) {
        try { qualifySettings = JSON.parse(rec.data); } catch(e) {}
      }
    }
    async function persistQualifySettings() {
      const payload = { type: 'qualify_settings_data', data: JSON.stringify(qualifySettings) };
      if (qualifySettingsRecord) {
        await window.dataSdk.update({ ...qualifySettingsRecord, ...payload });
      } else {
        await window.dataSdk.create({ id: 'qualify-settings-singleton', ...payload, created_at: new Date().toISOString() });
      }
    }
    function getQualifyCount(tid, group) {
      var key = tid + '_' + group;
      return qualifySettings[key] !== undefined ? qualifySettings[key] : 2;
    }
    function setQualifyCount(tid, group, val) {
      var key = tid + '_' + group;
      qualifySettings[key] = parseInt(val) || 1;
      persistQualifySettings();
      render();
    }
    function getBracket(tid) {
      if (!bracketData[tid]) bracketData[tid]={prevRounds:[],octavos:Array(16).fill(''),cuartos:Array(8).fill(''),semis:Array(4).fill(''),final:Array(2).fill(''),campeon:''};
      if (!bracketData[tid].prevRounds) bracketData[tid].prevRounds=[];
      return bracketData[tid];
    }
    function addPrevRound(tid) {
      var b=getBracket(tid);
      var num=b.prevRounds.length+1;
      b.prevRounds.push({label: num+'a RONDA', slots: Array(16).fill('')});
      saveBrackets(bracketData, tid); render();
    }
    function removePrevRound(tid, roundIdx) {
      var b=getBracket(tid);
      b.prevRounds.splice(roundIdx,1);
      saveBrackets(bracketData, tid); render();
    }
    function setPrevRoundSlot(tid, roundIdx, slotIdx, value) {
      var b=getBracket(tid);
      b.prevRounds[roundIdx].slots[slotIdx]=value;
      saveBrackets(bracketData, tid); render();
    }
    function setPrevRoundLabel(tid, roundIdx, value) {
      var b=getBracket(tid);
      b.prevRounds[roundIdx].label=value;
      saveBrackets(bracketData, tid); render();
    }
    function setBracketSlot(tid, ronda, idx, value) {
      var b=getBracket(tid);
      if(ronda==='campeon') b.campeon=value; else b[ronda][idx]=value;
      saveBrackets(bracketData, tid); render();
    }
    async function resetBracket(tid) {
      if(!confirm('¿Limpiar todo el bracket?')) return;
      delete bracketData[tid];
      const existing = allBracketRecords.find(r => r.tournament_id === tid);
      if (existing) { await window.dataSdk.delete(existing); }
      render();
    }

    let allPlayers = [];
    let allMatches = [];
    let allPlayerProfiles = [];
    let hiddenBaseTournaments = []; // IDs de torneos base (tournament1..7) eliminados por el usuario
    let recordCount = 0;

    const dataHandler = {
      onDataChanged(data) {
        recordCount = data.length;

        allPlayers = data.filter(record => record.type === 'player');
        allMatches = data.filter(record => record.type === 'match');
        allPlayerProfiles = data.filter(record => record.type === 'player_profile');
        allTournamentPhotos = data.filter(record => record.type === 'tournament_photo');
        hiddenBaseTournaments = data.filter(record => record.type === 'hidden_base_tournament').map(r => r.tournament_id);
        // Fusionar torneos custom desde MySQL (tabla + registros)
        const fromRecords = data
          .filter(record => record.type === 'custom_tournament')
          .map(r => ({ id: r.tournament_id || r.id, name: r.name, isCustom: true }));
        const byId = new Map(customTournaments.map(t => [t.id, t]));
        fromRecords.forEach(t => byId.set(t.id, t));
        customTournaments = Array.from(byId.values());

        buildManualRankingFromAPI(data);
        buildTournamentNamesFromAPI(data);
        buildLegendFromAPI(data);
        buildBracketsFromAPI(data);
        buildQualifySettingsFromAPI(data);
        buildTournamentSettingsFromAPI(data);

        render();
      }
    };

    // ── Nombres de torneos editables — guardados en MySQL ──
    var allTournamentNameOverrides = []; // tipo: tournament_name_override
    var editingTournamentNameId = null; // id del torneo cuyo nombre se está editando

    function buildTournamentNamesFromAPI(data) {
      allTournamentNameOverrides = data.filter(r => r.type === 'tournament_name_override');
      // Aplicar nombres guardados al config
      allTournamentNameOverrides.forEach(rec => {

          window.elementSdk.config[configKey] = rec.name;
          defaultConfig[configKey] = rec.name;

        // Para torneos custom, actualizar en customTournaments array
        if (rec.is_custom && rec.tournament_id) {
          const ct = customTournaments.find(t => t.id === rec.tournament_id);
          if (ct) ct.name = rec.name;
        }
      });

    const playersGroupA = [];
    const playersGroupB = [];

    function getTournaments() {
      const base = [
        { id: 'tournament7', name: window.elementSdk.config.tournament_7_name || defaultConfig.tournament_7_name, hasGroups: true, maxPlayersPerGroup: tournamentSettings.tournament7_max || 10, groupCount: tournamentSettings.tournament7_groups || 2 },
        { id: 'tournament2', name: window.elementSdk.config.tournament_2_name || defaultConfig.tournament_2_name, hasGroups: true, maxPlayersPerGroup: tournamentSettings.tournament2_max || 10, groupCount: tournamentSettings.tournament2_groups || 2 },
        { id: 'tournament3', name: window.elementSdk.config.tournament_3_name || defaultConfig.tournament_3_name, hasGroups: true, maxPlayersPerGroup: tournamentSettings.tournament3_max || 10, groupCount: tournamentSettings.tournament3_groups || 2 },
        { id: 'tournament4', name: window.elementSdk.config.tournament_4_name || defaultConfig.tournament_4_name, hasGroups: true, maxPlayersPerGroup: tournamentSettings.tournament4_max || 10, groupCount: tournamentSettings.tournament4_groups || 2 },
        { id: 'tournament5', name: window.elementSdk.config.tournament_5_name || defaultConfig.tournament_5_name, hasGroups: true, maxPlayersPerGroup: tournamentSettings.tournament5_max || 10, groupCount: tournamentSettings.tournament5_groups || 2 },
        { id: 'tournament6', name: window.elementSdk.config.tournament_6_name || defaultConfig.tournament_6_name, hasGroups: true, maxPlayersPerGroup: tournamentSettings.tournament6_max || 10, groupCount: tournamentSettings.tournament6_groups || 2 },
        { id: 'tournament1', name: window.elementSdk.config.tournament_1_name || defaultConfig.tournament_1_name, hasGroups: true, maxPlayersPerGroup: tournamentSettings.tournament1_max || 10, groupCount: tournamentSettings.tournament1_groups || 2 }
      ].filter(t => !hiddenBaseTournaments.includes(t.id));
      const custom = customTournaments.map(t => ({
        id: t.id,
        name: t.name,
        hasGroups: true,
        maxPlayersPerGroup: tournamentSettings[t.id + '_max'] || 10,
        groupCount: tournamentSettings[t.id + '_groups'] || 2,
        isCustom: true
      }));
      return [...base, ...custom];
    }

    function getTournamentPlayers(tournamentId, group = null) {
      let players = allPlayers.filter(p => p.tournament_id === tournamentId);
      if (group) {
        players = players.filter(p => p.group === group);
      }
      return players;
    }

    function getTournamentMatches(tournamentId) {
      return allMatches.filter(m => m.tournament_id === tournamentId);
    }

    function namesMatch(a, b) {
      return String(a || '').trim().toLowerCase().replace(/\s+/g, ' ')
        === String(b || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function getPlayerProfile(playerName) {
      return allPlayerProfiles.find(p => namesMatch(p.player_name, playerName));
    }

    function isRecordValidated(record) {
      const v = record.validated;
      if (v === false || v === 0 || v === '0' || v === 'false') return false;
      if (v === true || v === 1 || v === '1' || v === 'true') return true;
      if (isRecordPendingValidation(record)) return false;
      return parseSetsCount(record.sets_won) !== null
        && parseSetsCount(record.sets_lost) !== null
        && !!record.winner;
    }

    function isRecordPendingValidation(record) {
      const v = record.pending_validation;
      return v === true || v === 1 || v === '1' || v === 'true';
    }

    function parseSetsCount(value) {
      if (value === undefined || value === null || value === '') return null;
      const n = parseInt(value, 10);
      return isNaN(n) ? null : n;
    }

    function getTournamentDisplayName(tid) {
      const listed = getTournaments().find(t => t.id === tid);
      if (listed) return listed.name;
      const custom = customTournaments.find(t => t.id === tid);
      if (custom) return custom.name;
      const override = allTournamentNameOverrides.find(r => r.tournament_id === tid);
      if (override && override.name) return override.name;
      return tid;
    }

    function getRankingTournamentColumns() {
      const seen = new Set();
      const columns = [];
      getTournaments().forEach(t => {
        if (seen.has(t.id)) return;
        seen.add(t.id);
        columns.push({ id: t.id, name: t.name });
      });
      allMatches.forEach(m => {
        if (!m.tournament_id || seen.has(m.tournament_id)) return;
        seen.add(m.tournament_id);
        columns.push({ id: m.tournament_id, name: getTournamentDisplayName(m.tournament_id) });
      });
      return columns;
    }

    function getMatchContribution(match, playerName) {
      if (!isRecordValidated(match)) return null;
      if (!match.winner) return null;
      if (!namesMatch(match.player1, playerName) && !namesMatch(match.player2, playerName)) return null;

      const winnerSets = parseSetsCount(match.sets_won);
      const loserSets = parseSetsCount(match.sets_lost);
      if (winnerSets === null || loserSets === null) return null;

      const isWinner = namesMatch(match.winner, playerName);
      const setsWon = isWinner ? winnerSets : loserSets;
      const setsLost = isWinner ? loserSets : winnerSets;
      let points = 0;
      if (isWinner) {
        points = (setsWon === 2 && setsLost === 0) ? 3 : 2;
      } else if (setsWon === 1 && setsLost === 2) {
        points = 1;
      }

      const opponent = namesMatch(match.player1, playerName) ? match.player2 : match.player1;
      const matchDate = match.created_at ? new Date(match.created_at) : new Date();
      return { isWinner, setsWon, setsLost, points, opponent, matchDate, match };
    }

    function computePlayerRankingStats(playerName) {
      let totalPoints = 0;
      let totalWins = 0;
      let totalLosses = 0;
      let totalSetsWon = 0;
      let totalSetsLost = 0;
      const contributions = [];
      const pointsByTournament = {};

      // Suma automática de TODOS los torneos (anteriores y nuevos) desde MySQL
      allMatches.forEach(match => {
        const contribution = getMatchContribution(match, playerName);
        if (!contribution) return;
        contributions.push(contribution);
        totalSetsWon += contribution.setsWon;
        totalSetsLost += contribution.setsLost;
        totalPoints += contribution.points;
        if (contribution.isWinner) totalWins++;
        else totalLosses++;
        const tid = match.tournament_id || 'sin-torneo';
        pointsByTournament[tid] = (pointsByTournament[tid] || 0) + contribution.points;
      });

      const totalMatches = totalWins + totalLosses;
      const efficiency = totalMatches > 0 ? parseFloat(((totalWins / totalMatches) * 100).toFixed(1)) : 0;

      return {
        points: totalPoints,
        wins: totalWins,
        losses: totalLosses,
        setsWon: totalSetsWon,
        setsLost: totalSetsLost,
        matchesPlayed: totalMatches,
        efficiency,
        contributions,
        pointsByTournament
      };
    }

    function calculateUTR(playerName, pointsByPlayer, rankByPlayer) {
      const twelveMonthsAgo = new Date();
      twelveMonthsAgo.setMonth(twelveMonthsAgo.getMonth() - 12);

      const stats = computePlayerRankingStats(playerName);
      const recentMatches = stats.contributions
        .filter(c => !isNaN(c.matchDate) && c.matchDate >= twelveMonthsAgo)
        .sort((a, b) => b.matchDate - a.matchDate)
        .slice(0, 10);

      if (recentMatches.length === 0) return 0;

      const myRank = rankByPlayer[playerName] || 999;
      const myPoints = pointsByPlayer[playerName] || 0;
      let totalWeightedScore = 0;
      let totalWeight = 0;

      recentMatches.forEach((contribution, index) => {
        const { isWinner, setsWon, setsLost, opponent } = contribution;
        const opponentRank = rankByPlayer[opponent] || 999;
        const opponentPoints = pointsByPlayer[opponent] || 0;
        const pointDiff = opponentPoints - myPoints;
        const rankDiff = myRank - opponentRank;

        let matchScore = 5.0;

        if (isWinner) {
          matchScore = (setsWon === 2 && setsLost === 0) ? 9.0 : 7.0;
          if (rankDiff > 0) {
            matchScore += Math.min(rankDiff * 0.15, 2.5);
            if (setsWon === 2 && setsLost === 0) matchScore += 0.75;
          } else if (rankDiff < 0) {
            matchScore -= Math.min(Math.abs(rankDiff) * 0.08, 1.5);
          }
          if (pointDiff > 0) matchScore += Math.min(pointDiff * 0.04, 1.5);
        } else {
          matchScore = (setsWon === 1 && setsLost === 2) ? 3.5 : 1.5;
          if (rankDiff > 0) matchScore += Math.min(rankDiff * 0.12, 1.2);
          else if (rankDiff < 0) matchScore -= Math.min(Math.abs(rankDiff) * 0.06, 1.0);
          if (pointDiff > 0) matchScore += Math.min(pointDiff * 0.03, 0.8);
        }

        matchScore = Math.max(0, Math.min(10, matchScore));
        const weight = Math.pow(0.75, index);
        totalWeightedScore += matchScore * weight;
        totalWeight += weight;
      });

      return totalWeight > 0 ? parseFloat((totalWeightedScore / totalWeight).toFixed(2)) : 0;
    }

    function buildPlayerRankings() {
      const seen = new Set();
      const autoStats = {};

      // Incluir jugadores con perfil
      allPlayerProfiles.forEach(profile => {
        const name = profile.player_name;
        if (!name || seen.has(name)) return;
        seen.add(name);
        autoStats[name] = computePlayerRankingStats(name);
      });

      // Incluir inscritos en cualquier torneo (aunque aún no tengan perfil)
      allPlayers.forEach(player => {
        const name = player.player_name;
        if (!name || seen.has(name)) return;
        seen.add(name);
        autoStats[name] = computePlayerRankingStats(name);
      });

      // Incluir jugadores que aparecen en partidos validados pero no tienen perfil
      allMatches.forEach(match => {
        if (!isRecordValidated(match)) return;
        [match.player1, match.player2].forEach(name => {
          if (!name || seen.has(name)) return;
          seen.add(name);
          autoStats[name] = computePlayerRankingStats(name);
        });
      });

      const pointsByPlayer = {};
      Object.keys(autoStats).forEach(name => {
        pointsByPlayer[name] = autoStats[name].points;
      });

      const rankByPlayer = {};
      Object.keys(autoStats)
        .map(name => ({ name, points: autoStats[name].points }))
        .sort((a, b) => b.points - a.points)
        .forEach((entry, index) => {
          rankByPlayer[entry.name] = index + 1;
        });

      const twelveMonthsAgo = new Date();
      twelveMonthsAgo.setMonth(twelveMonthsAgo.getMonth() - 12);

      const playerRankings = Object.keys(autoStats).map(name => {
        const stats = autoStats[name];
        const utr = calculateUTR(name, pointsByPlayer, rankByPlayer);
        const recentMatchCount = stats.contributions.filter(c =>
          !isNaN(c.matchDate) && c.matchDate >= twelveMonthsAgo
        ).length;

        const profile = getPlayerProfile(name) || { photo_url: '', club: '' };
        return {
          name,
          points: stats.points,
          wins: stats.wins,
          losses: stats.losses,
          setsWon: stats.setsWon,
          setsLost: stats.setsLost,
          matchesPlayed: stats.matchesPlayed,
          efficiency: stats.efficiency,
          pointsByTournament: stats.pointsByTournament || {},
          utr,
          recentMatchCount,
          profile
        };
      });

      playerRankings.sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        if (b.wins !== a.wins) return b.wins - a.wins;
        return b.efficiency - a.efficiency;
      });

      return playerRankings;
    }

    function getPendingValidations() {
      return allMatches.filter(m => isRecordPendingValidation(m) && !isRecordValidated(m));
    }

    function calculatePlayerStats(playerName) {
      const stats = computePlayerRankingStats(playerName);
      return {
        totalMatches: stats.matchesPlayed,
        totalWins: stats.wins,
        totalLosses: stats.losses,
        totalSetsWon: stats.setsWon,
        totalSetsLost: stats.setsLost,
        totalPoints: stats.points,
        efficiency: stats.efficiency,
        pointsByTournament: stats.pointsByTournament || {}
      };
    }

    function calculateStandings(tournamentId, group = null) {
      const players = getTournamentPlayers(tournamentId, group);
      const matches = getTournamentMatches(tournamentId);

      const standings = players.map(player => {
        let points = 0;
        let wins = 0;
        let losses = 0;

        matches.forEach(match => {
          const contribution = getMatchContribution(match, player.player_name);
          if (!contribution) return;
          points += contribution.points;
          if (contribution.isWinner) wins++;
          else losses++;
        });

        return {
          name: player.player_name,
          points,
          wins,
          losses,
          matchesPlayed: wins + losses
        };
      });

      return standings.sort((a, b) => b.points - a.points || b.wins - a.wins);
    }

    function generateRoundRobinDraw(players) {
      const matches = [];
      for (let i = 0; i < players.length; i++) {
        for (let j = i + 1; j < players.length; j++) {
          matches.push({
            player1: players[i].player_name,
            player2: players[j].player_name
          });
        }
      }
      return matches;
    }

      }

      const result = await window.dataSdk.create({
        id: `match-${Date.now()}-${Math.random()}`,
        type: 'match',
        tournament_id: tournamentId,
        player1,
        player2,
        score,
        winner,
        sets_won: setsWon,
        sets_lost: setsLost,
        validated: true,
        pending_validation: false,
        created_at: new Date().toISOString()
      });

      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Guardar Resultado';
      }

      if (result.isOk) {
        showMessage('Resultado guardado. Ranking y estadísticas actualizados.', 'success');
      } else {
        showMessage('Error al guardar resultado', 'error');
      }
    }

    async function validateMatch(matchRecord) {
      const btn = document.querySelector(`button[data-validate-match="${matchRecord.id}"]`);
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Validando...';
      }

      const result = await window.dataSdk.update({
        ...matchRecord,
        validated: true,
        pending_validation: false
      });

      if (btn) {
        btn.disabled = false;
        btn.textContent = '✅ Validar';
      }

      if (result.isOk) {
        showMessage('¡Resultado validado correctamente!', 'success');
      } else {
        showMessage('Error al validar resultado', 'error');
      }
    }

    async function rejectMatch(matchRecord) {
      const btn = document.querySelector(`button[data-reject-match="${matchRecord.id}"]`);
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Rechazando...';
      }

      const result = await window.dataSdk.delete(matchRecord);

      if (btn) {
        btn.disabled = false;
        btn.textContent = '❌ Rechazar';
      }

      if (result.isOk) {
        showMessage('Resultado rechazado. El partido debe jugarse nuevamente.', 'success');
      } else {
        showMessage('Error al rechazar resultado', 'error');
      }
    }

    async function deleteMatch(matchRecord) {
      const btn = document.querySelector(`button[data-delete-match="${matchRecord.id}"]`);
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Eliminando...';
      }

      const result = await window.dataSdk.delete(matchRecord);

      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Eliminar';
      }

      if (result.isOk) {
        showMessage('Resultado eliminado correctamente', 'success');
      } else {
        showMessage('Error al eliminar resultado', 'error');
      }
    }

    function showMessage(message, type) {
      const container = document.getElementById('message-container');
      if (!container) return;

      const bgColor = type === 'success' ? '#10b981' : '#ef4444';
      container.innerHTML = `
        <div style="background: ${bgColor}; color: white; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; animation: slideDown 0.3s ease;">
          ${message}
        </div>
      `;

      setTimeout(() => {
        const c = document.getElementById('message-container');
        if (c) c.innerHTML = '';
      }, 3000);
    }

    function autoResizeTextarea(el) {
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    function updateGroupCount(tournamentId, currentValue) {
      // Si es un número, úsalo directamente; si no, intenta parsearlo
      let newValue;
      if (typeof currentValue === 'number') {
        newValue = currentValue;
      } else {
        newValue = parseInt(currentValue) || 2;
      }

      // Asegurar que esté dentro del rango válido
      newValue = Math.max(1, Math.min(8, newValue));

      tournamentSettings[`${tournamentId}_groups`] = newValue;

      const inputEl = document.getElementById('group-count-input');
      if (inputEl) {
        inputEl.value = newValue;
      }

      persistTournamentSettings();
      render();
    }

    function recalcRankingPositions() {
      // Solo en modo admin y vista ranking
      if (!isAdminLoggedIn || currentView !== 'ranking') return;
      const table = document.querySelector('table');
      if (!table) return;
      const tbody = table.querySelector('tbody');
      if (!tbody) return;
      const rows = Array.from(tbody.querySelectorAll('tr'));
      if (rows.length === 0) return;

      // Extraer datos de cada fila
      const rowData = rows.map(row => {
        const inputs = row.querySelectorAll('input');
        const nameCell = row.querySelector('td:nth-child(2)');
        const name = nameCell ? nameCell.textContent.trim().split('\n')[0].trim() : '';
        const ptsInput = row.querySelector('td:nth-child(4) input');
        const pgInput = row.querySelector('td:nth-child(6) input');
        const ppInput = row.querySelector('td:nth-child(7) input');
        const pts = ptsInput ? parseInt(ptsInput.value) || 0 : 0;
        const pg = pgInput ? parseInt(pgInput.value) || 0 : 0;
        const pp = ppInput ? parseInt(ppInput.value) || 0 : 0;
        const ef = pg + pp > 0 ? parseFloat(((pg / (pg + pp)) * 100).toFixed(1)) : 0;
        return { row, name, pts, pg, pp, ef };
      });

      // Ordenar por PTS -> PG -> EF (mismo criterio que buildPlayerRankings)
      rowData.sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        if (b.pg !== a.pg) return b.pg - a.pg;
        return b.ef - a.ef;
      });

      // Actualizar posiciones visualmente
      rowData.forEach((data, idx) => {
        const posCell = data.row.querySelector('td:nth-child(1)');
        if (posCell) {
          const posInput = posCell.querySelector('input');
          const autoPos = idx + 1;
          if (posInput) {
            // Solo actualizar si el admin no editó manualmente la posición
            const manualPos = parseInt(posInput.value);
            const ovr = manualRankingOrder[data.name] || {};
            if (ovr.pos === undefined || ovr.pos === null || ovr.pos === '') {
              posInput.value = autoPos;
            }
          } else {
            // Modo público (no debería pasar en admin, pero por si acaso)
            posCell.innerHTML = '<span style="font-size:16px; display:inline-block; margin-right:4px;"></span><span style="font-weight:700; color:#3b82f6; font-size:14.4px;">' + autoPos + '</span>';
          }
        }
      });
    }

    function handleAddMatch(event, tournamentId) {
      event.preventDefault();
      if (!isAdminLoggedIn) {
        showMessage('🔑 Debes iniciar sesión como administrador para cargar resultados', 'error');
        showAdminLoginModal();
        return;
      }
      const formData = new FormData(event.target);
      const player1 = formData.get('player1');
      const player2 = formData.get('player2');
      const score = (formData.get('score') || '').trim();
      const winner = formData.get('winner');
      const setsWon = formData.get('setsWon');
      const setsLost = formData.get('setsLost');

      if (player1 === player2) {
        showMessage('Los jugadores deben ser diferentes', 'error');
        return;
      }

      if (!setsWon || !setsLost) {
        showMessage('Selecciona los sets ganados y perdidos', 'error');
        return;
      }
      const totalSets = parseInt(setsWon) + parseInt(setsLost);
      if (totalSets < 2 || totalSets > 3) {
        showMessage('El total de sets debe ser 2 o 3', 'error');
        return;
      }

      if (parseInt(setsWon) !== 2) {
        showMessage('El ganador debe tener 2 sets ganados', 'error');
        return;
      }

      if (player1 && player2 && score && winner && setsWon && setsLost) {
        addMatch(tournamentId, player1, player2, score, winner, setsWon, setsLost);
        event.target.reset();
      }
    }

    async function handlePhotoUpload(event) {
      if (!isAdminLoggedIn) {
        showMessage('🔑 Debes iniciar sesión como administrador para subir fotos', 'error');
        showAdminLoginModal();
        return;
      }
      const file = event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showMessage('Por favor selecciona un archivo de imagen válido', 'error');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        showMessage('La imagen es demasiado grande. Máximo 5MB', 'error');
        return;
      }
      // Mostrar indicador de carga
      const previewContainer = document.getElementById('photo-preview-container');
      if (previewContainer) {
        previewContainer.innerHTML = '<div style="padding:12px;opacity:0.7;">⏳ Subiendo imagen...</div>';
      }
      try {
        const formData = new FormData();
        formData.append('photo', file);
        const res = await fetch('api.php?action=uploadPhoto', { method: 'POST', body: formData });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Error al subir');
        const photoUrl = json.url;
        const photoUrlInput = document.getElementById('photoUrl');
        if (photoUrlInput) photoUrlInput.value = photoUrl;
        const config = window.elementSdk.config;
        const surfaceColor = config.surface_color || defaultConfig.surface_color;
        const fontSize = config.font_size || defaultConfig.font_size;
        if (previewContainer) {
          previewContainer.innerHTML = `
            <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: ${surfaceColor}; border-radius: 8px;">
              <img src="${photoUrl}" alt="Preview" style="width: 80px; height: 80px; border-radius: 8px; object-fit: cover; border: 2px solid #10b981;">

                <div style="font-size: ${fontSize * 0.9}px; font-weight: 600; color: #10b981; margin-bottom: 4px;">✅ Imagen subida</div>
                <div style="font-size: ${fontSize * 0.8}px; opacity: 0.7;">${file.name}</div>
                <div style="font-size: ${fontSize * 0.75}px; opacity: 0.6;">${(file.size / 1024).toFixed(0)} KB</div>
              </div>
            </div>`;
        }
        showMessage('Imagen subida correctamente', 'success');
      } catch(e) {
        if (previewContainer) previewContainer.innerHTML = '';
        showMessage('Error al subir la imagen: ' + e.message, 'error');
      }
    }

    function downloadBackup() {
      if (!isAdminLoggedIn) {
        showMessage('🔑 Debes iniciar sesión como administrador para descargar respaldo', 'error');
        showAdminLoginModal();
        return;
      }
      const allData = [
        ...allPlayers,
        ...allMatches,
        ...allPlayerProfiles,
        ...allRankingOverrides,
        ...allLegendOverrides,
        ...allTournamentNameOverrides,
        ...allTournamentPhotos
      ];

      const backupData = {
        version: '1.0',
        timestamp: new Date().toISOString(),
        data: allData
      };

      const dataStr = JSON.stringify(backupData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = url;
      link.download = `torneo-backup-${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      showMessage('Respaldo descargado correctamente', 'success');
    }

    async function restoreBackup(event) {
      if (!isAdminLoggedIn) {
        showMessage('🔑 Debes iniciar sesión como administrador para restaurar respaldo', 'error');
        showAdminLoginModal();
        return;
      }
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const backupData = JSON.parse(e.target.result);

          if (!backupData.version || !backupData.data) {
            showMessage('Archivo de respaldo inválido', 'error');
            return;
          }

          const restoreBtn = document.querySelector('button[onclick*="restore-input"]');
          if (restoreBtn) {
            restoreBtn.disabled = true;
            restoreBtn.innerHTML = '⏳ Restaurando...';
          }

          let successCount = 0;
          let errorCount = 0;

          for (const record of backupData.data) {
            if (recordCount >= 999) {
              showMessage(`Límite de 999 registros alcanzado. Restaurados ${successCount} de ${backupData.data.length} registros.`, 'error');
              break;
            }

            const { __backendId, ...recordWithoutId } = record;

            const result = await window.dataSdk.create(recordWithoutId);

            if (result.isOk) {
              successCount++;
            } else {
              errorCount++;
            }

            await new Promise(resolve => setTimeout(resolve, 50));
          }

          if (restoreBtn) {
            restoreBtn.disabled = false;
            restoreBtn.innerHTML = '📂 Restaurar Respaldo';
          }

          if (errorCount === 0) {
            showMessage(`Respaldo restaurado correctamente: ${successCount} registros`, 'success');
          } else {
            showMessage(`Restauración parcial: ${successCount} éxitos, ${errorCount} errores`, 'error');
          }

          event.target.value = '';

        } catch (error) {
          showMessage('Error al leer el archivo de respaldo', 'error');
          console.error(error);

          const restoreBtn = document.querySelector('button[onclick*="restore-input"]');
          if (restoreBtn) {
            restoreBtn.disabled = false;
            restoreBtn.innerHTML = '📂 Restaurar Respaldo';
          }
        }
      };

      reader.readAsText(file);
    }

    function autoCalcEF(playerName, inputEl) {
      const row = inputEl && inputEl.closest ? inputEl.closest('tr') : null;
      if (!row) return;
      const pgInput = row.querySelector('input[data-rank-pg]');
      const ppInput = row.querySelector('input[data-rank-pp]');
      const efInput = row.querySelector('input[data-rank-ef]');
      if (!pgInput || !ppInput || !efInput) return;
      const pg = parseInt(pgInput.value) || 0;
      const pp = parseInt(ppInput.value) || 0;
      const total = pg + pp;
      const newEf = total > 0 ? parseFloat(((pg / total) * 100).toFixed(1)) : 0;
      efInput.value = newEf;
      // Guardar en memoria también
      if (!manualRankingOrder[playerName]) manualRankingOrder[playerName] = {};
      manualRankingOrder[playerName]['ef'] = newEf;
      if (!pendingRankingChanges[playerName]) pendingRankingChanges[playerName] = {};
      pendingRankingChanges[playerName]['ef'] = newEf;
    }

    function saveRankingField(playerName, field, rawValue) {
      // IGNORAR si el nombre es la plantilla sin interpolar (bug anterior)
      if (playerName === '${safeName}') {
        console.error('[RANKING] ERROR: playerName es ${safeName}, no se guardará');
        return;
      }
      const val = field === 'utr' || field === 'ef'
        ? parseFloat(rawValue)
        : parseInt(rawValue);
      if (isNaN(val)) return;
      if (!manualRankingOrder[playerName]) manualRankingOrder[playerName] = {};
      manualRankingOrder[playerName][field] = val;
      // Mark as pending (not saved to MySQL yet)
      if (!pendingRankingChanges[playerName]) pendingRankingChanges[playerName] = {};
      pendingRankingChanges[playerName][field] = val;
      // Si se editó PG o PP, recalcular EF% automáticamente en memoria
      if (field === 'pg' || field === 'pp') {
        const ovr = manualRankingOrder[playerName] || {};
        const pg = field === 'pg' ? val : (ovr.pg !== undefined ? ovr.pg : null);
        const pp = field === 'pp' ? val : (ovr.pp !== undefined ? ovr.pp : null);
        const autoStats = computePlayerRankingStats(playerName);
        const autoPg = autoStats.wins;
        const autoPp = autoStats.losses;
        const finalPg = pg !== null ? pg : autoPg;
        const finalPp = pp !== null ? pp : autoPp;
        const total = finalPg + finalPp;
        if (total > 0) {
          const newEf = parseFloat(((finalPg / total) * 100).toFixed(1));
          manualRankingOrder[playerName]['ef'] = newEf;
          pendingRankingChanges[playerName]['ef'] = newEf;
        }
      }
      // Si se editó PTS, PG, PP, SG, SP o EF, recalcular UTR automáticamente en memoria.
      // Fórmula proxy: mapea la eficiencia (PG/(PG+PP)) de escala 0-100% a escala 0-10 (UTR),
      // con un pequeño ajuste por PTS relativo. No reemplaza el cálculo real basado en
      // historial de partidos (calculateUTR); solo da una referencia editable manualmente.
      if (['pts', 'pg', 'pp', 'sg', 'sp', 'ef'].includes(field)) {
        const ovr = manualRankingOrder[playerName] || {};
        const efForUtr = ovr.ef !== undefined ? ovr.ef : null;
        if (efForUtr !== null) {
          const ptsBonus = ovr.pts !== undefined ? Math.min(ovr.pts * 0.005, 1.0) : 0;
          const newUtr = Math.max(0, Math.min(10, parseFloat(((efForUtr / 100) * 9 + ptsBonus).toFixed(2))));
          manualRankingOrder[playerName]['utr'] = newUtr;
          pendingRankingChanges[playerName]['utr'] = newUtr;
        }
      }
      // Actualizar el botón visualmente
      const btn = document.getElementById('btn-save-ranking');
      if (btn) {
        btn.style.background = '#16a34a';
        const count = Object.keys(pendingRankingChanges).reduce((sum, name) => sum + Object.keys(pendingRankingChanges[name]).length, 0);
        btn.innerHTML = '💾 Guardar cambios' + (count > 0 ? ' (' + count + ')' : '');
      }
      // Recalcular posiciones automáticamente basado en puntos mostrados
      recalcRankingPositions();
    }

    async function resetManualRanking() {
      if (!confirm('¿Restablecer todos los datos automáticos del ranking?')) return;
      // Delete all ranking_override records from MySQL
      for (const rec of allRankingOverrides) {
        await window.dataSdk.delete(rec);
      }
      manualRankingOrder = {};
      allRankingOverrides = [];
      pendingRankingChanges = {};
      showMessage('Ranking restablecido a datos automáticos', 'success');
      render();
    }

    async function handleAddTournament(event) {
      event.preventDefault();
      if (!isAdminLoggedIn) {
        showMessage('🔑 Debes iniciar sesión como administrador para crear torneos', 'error');
        showAdminLoginModal();
        return;
      }
      const nameInput = document.getElementById('new-tournament-name');
      const name = nameInput ? nameInput.value.trim() : '';
      if (!name) return;
      const id = 'custom_' + Date.now();
      await saveCustomTournamentToAPI({ id, name });
      await loadCustomTournamentsFromAPI();
      tournamentSettings[id + '_max'] = 10;
      tournamentSettings[id + '_groups'] = 2;
      await persistTournamentSettings();
      showMessage('Torneo "' + name + '" creado correctamente', 'success');
      render();
    }

    async function handleDeleteTournament(tournamentId, event) {
      if (event) event.stopPropagation();
      const tournament = getTournaments().find(t => t.id === tournamentId);
      if (!tournament) return;

      // Solicitar contraseña
      const password = prompt('🔒 Ingresa la contraseña de administrador para eliminar el torneo "' + tournament.name + '":');
      if (password === null) return; // Cancelado
      if (password !== ADMIN_PASSWORD) {
        alert('❌ Contraseña incorrecta. Eliminación cancelada.');
        return;
      }

      if (!confirm('¿Eliminar el torneo "' + tournament.name + '"? Se eliminarán también todos sus jugadores y partidos.')) return;

      const matchesToDelete = allMatches.filter(m => m.tournament_id === tournamentId);
      const playersToDelete = allPlayers.filter(p => p.tournament_id === tournamentId);
      const photosToDelete = allTournamentPhotos.filter(p => p.tournament_id === tournamentId);
      for (const rec of matchesToDelete) await window.dataSdk.delete(rec);
      for (const rec of playersToDelete) await window.dataSdk.delete(rec);
      for (const rec of photosToDelete) await window.dataSdk.delete(rec);

      if (tournament.isCustom) {
        await deleteCustomTournamentFromAPI(tournamentId);
      } else {
        await window.dataSdk.create({ type: 'hidden_base_tournament', tournament_id: tournamentId });
      }

      showMessage('Torneo eliminado. Ranking actualizado automáticamente.', 'success');
    }
